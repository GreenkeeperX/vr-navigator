<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR-Navigator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text x='16' y='24' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='22' fill='%231c7c8c'>VR</text></svg>">
<script>try{var t=localStorage.getItem("vn.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a class="home" href="/"><span class="brand">VR</span>-Navigator</a></h1>
    <div class="meta" id="meta"></div>
    <button id="thmBtn" data-act="thm" title="Hell, dunkel oder wie das Gerät"></button>
    <button class="primary" id="syncBtn" data-act="sync" title="Preise jetzt abrufen">Aktualisieren</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"><p class="hint">Lädt …</p></main>
</div>
<dialog id="edit"></dialog>
<script src="js/app.js"></script>
</body>
</html>
