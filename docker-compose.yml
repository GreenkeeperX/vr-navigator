# Beispiel für den Betrieb mit dem fertigen Image.
# OWNER durch den GitHub-Benutzernamen ersetzen (klein geschrieben).
services:
  vr-navigator:
    image: ghcr.io/OWNER/vr-navigator:latest
    container_name: vr-navigator
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "8788:8788"
    # Nur nötig, wenn du das Tool über eine Domain aufrufst. IP-Adressen, Namen ohne Punkt und
    # Namen im eigenen Netz (.home.arpa, .local, .lan, .internal) gelten ohne Eintrag
    # environment:
    #   ALLOWED_HOSTS: "vr.beispiel.de"
    # Switch-Sammlung aus dem eShopKompass (ab 0.7.3, nur lesend): ESHOP_URL ist die Adresse, unter der
    # dieser Container den eShopKompass erreicht (am einfachsten im selben Docker-Netz über den
    # Containernamen), ESHOP_LINK die Adresse für Links im Browser
    #   ESHOP_URL: "http://eshop-kompass:8787"
    #   ESHOP_LINK: "http://server.home.arpa:8787"
    volumes:
      - vr-daten:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  vr-daten:
